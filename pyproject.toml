[project]
name = "decode"
version = "0.1.0"
description = "CoinGlass archive: decrypts, collects and analyses derivatives market data"
requires-python = ">=3.12"
dependencies = ["pycryptodome>=3.20", "fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
decode = "decode.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
browser = ["playwright>=1.62"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
